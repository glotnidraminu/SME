<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Music Player</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="app">
        <!-- Шапка -->
        <div class="header">
            <div class="logo">
                <i class="fab fa-spotify"></i>
                <h1>Spotify</h1>
            </div>
            <div id="authArea">
                <button id="loginButton" class="btn-login"><i class="fab fa-spotify"></i> Войти</button>
                <div id="userArea" style="display: none;">
                    <img id="userImage" class="user-avatar" src="">
                    <span id="userNameText"></span>
                    <button id="logoutButton" class="btn-logout">Выйти</button>
                </div>
            </div>
        </div>

        <!-- Жанры -->
        <div class="section">
            <h2><i class="fas fa-tag"></i> Жанр</h2>
            <div class="genre-group" id="genreGroup"></div>
            <button id="searchButton" class="btn-search" disabled><i class="fas fa-search"></i> Найти треки</button>
        </div>

        <!-- Треки -->
        <div class="section">
            <h2><i class="fas fa-headphones"></i> Треки</h2>
            <div id="trackList" class="track-list">
                <div class="empty-message">🎵 Авторизуйся и выбери жанр</div>
            </div>
        </div>

        <!-- Плеер -->
        <div id="playerPanel" class="player-panel" style="display: none;">
            <div class="player-cover" id="playerCover">🎵</div>
            <div class="player-text">
                <div id="playerTrackTitle" class="player-track">-</div>
                <div id="playerArtistTitle" class="player-artist">-</div>
            </div>
            <audio id="playerAudio" controls></audio>
            <button id="closePlayerButton" class="btn-close"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
